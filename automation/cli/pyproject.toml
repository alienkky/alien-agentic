[project]
name = "alien-agentic-cli"
version = "0.1.0"
description = "Alien Agentic — Master Orchestrator CLI (aa)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alien Kim", email = "alienkky@users.noreply.github.com" }]
license = { text = "Proprietary" }
dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 음성 명령 (`aa voice`) — 4090 GPU 에서 Whisper 로컬 실행, 무-API-키.
# 첫 설치 시 PyTorch + Whisper 모델 다운로드로 ~3GB 추가.
voice = [
  "openai-whisper>=20231117",
  "sounddevice>=0.4.6",
  "numpy>=1.24",
]

[project.scripts]
aa = "aa.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aa*"]
exclude = ["templates*", "tests*"]
