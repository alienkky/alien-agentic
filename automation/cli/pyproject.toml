[project]
name = "alien-agentic-cli"
version = "0.1.0"
description = "Alien Agentic — Master Orchestrator CLI (aa)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alien Kim", email = "alienkky@users.noreply.github.com" }]
license = { text = "Proprietary" }
dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
]

[project.scripts]
aa = "aa.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aa*"]
exclude = ["templates*", "tests*"]
