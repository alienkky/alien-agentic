name: Build Voice Translator APK

# 푸시할 때마다 디버그 APK를 빌드해 Artifacts 로 올린다.
# 폰에서 Actions 탭 → 최신 실행 → Artifacts → app-debug-apk 다운로드 후 설치.
on:
  push:
    branches:
      - claude/android-voice-translation-vfzzkz
    paths:
      - projects/android-voice-translator/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/android-voice-translator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: projects/android-voice-translator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
